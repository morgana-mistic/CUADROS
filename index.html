<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro interactivo</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #mensaje {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Georgia, serif;
            font-size: 22px;
            letter-spacing: 3px;
            text-align: center;
            cursor: pointer;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #mensaje.oculto {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <video id="video" autoplay muted playsinline>
        <source src="VIDEO.mp4" type="video/mp4">
    </video>

    <div id="mensaje">TOCA PARA DESPERTARLA</div>

    <script>
        const video = document.getElementById("video");
        const mensaje = document.getElementById("mensaje");

        function despertar() {
            video.muted = false;
            video.play();
            mensaje.classList.add("oculto");
        }

        mensaje.addEventListener("click", despertar);
        video.addEventListener("click", despertar);
    </script>

</body>
</html>

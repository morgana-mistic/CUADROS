<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro interactivo</title>

    <!-- Fuente manuscrita -->
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Mensaje inicial */
        #mensajeInicial {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            color: white;
            font-family: Georgia, serif;
            font-size: 22px;
            letter-spacing: 3px;
            text-align: center;

            text-shadow: 0 2px 8px rgba(0,0,0,0.8);

            cursor: pointer;
            z-index: 10;

            transition: opacity 0.5s ease;
        }

        #mensajeInicial.oculto {
            opacity: 0;
            pointer-events: none;
        }

        /* Zona del mensaje final */
        #mensajeFinal {
            position: absolute;

            left: 50%;
            top: 58%;

            transform: translate(-50%, -50%);

            width: 76%;

            color: #17130f;

            font-family: "Permanent Marker", cursive;
            font-size: clamp(24px, 5vw, 48px);
            line-height: 1.18;

            text-align: center;

            /*
               La pintura negra se integra con la textura
               de la pared en lugar de parecer texto digital.
            */
            mix-blend-mode: multiply;
            opacity: 0;

            text-shadow:
                0.5px 0.5px 0 rgba(0,0,0,0.35),
                -0.4px 0 rgba(0,0,0,0.15);

            z-index: 8;

            pointer-events: none;
        }

        /*
           Al terminar el video, la escritura comienza
           exactamente en ese momento.
        */
        #mensajeFinal.revelado {
            animation: escritura 1.6s ease-out forwards;
        }

        @keyframes escritura {

            0% {
                opacity: 0;
                clip-path: inset(0 100% 0 0);
            }

            100% {
                opacity: 0.90;
                clip-path: inset(0 0 0 0);
            }
        }
    </style>
</head>

<body>

    <video id="video" autoplay muted playsinline>
        <source src="VIDEO.mp4" type="video/mp4">
    </video>

    <div id="mensajeInicial">
        TOCA PARA DESPERTARLA
    </div>

    <div id="mensajeFinal">
        NO FUE CASUALIDAD QUE LLEGARAS HASTA AQUÍ.
    </div>

    <script>

        const video = document.getElementById("video");
        const mensajeInicial = document.getElementById("mensajeInicial");
        const mensajeFinal = document.getElementById("mensajeFinal");

        let despertada = false;

        function despertar() {

            if (despertada) return;

            despertada = true;

            video.muted = false;
            video.play();

            mensajeInicial.classList.add("oculto");
        }

        /* El primer toque despierta la obra */
        mensajeInicial.addEventListener("click", despertar);

        video.addEventListener("click", despertar);

        /*
           Cuando llega exactamente al último fotograma,
           comienza inmediatamente la escritura.
        */
        video.addEventListener("ended", function() {

            mensajeFinal.classList.add("revelado");

        });

    </script>

</body>
</html>

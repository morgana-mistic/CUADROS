```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro interactivo</title>

    <!-- Fuente manuscrita -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /*
           El video conserva siempre sus proporciones
           y entra completo en la pantalla.
        */
        video {
    width: 100vw;
    height: 100vh;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

        /* Mensaje inicial */
        #mensajeInicial {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            color: white;
            font-family: Georgia, serif;
            font-size: 22px;
            letter-spacing: 3px;
            text-align: center;

            text-shadow: 0 2px 8px rgba(0,0,0,0.8);

            cursor: pointer;
            z-index: 10;

            transition: opacity 0.5s ease;
        }

        #mensajeInicial.oculto {
            opacity: 0;
            pointer-events: none;
        }

        /* Mensaje final */
        #mensajeFinal {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            /*
               Más ancho para que el texto pueda crecer
               sin quedar demasiado comprimido.
            */
            width: 82%;
            max-width: 1100px;

            color: #100c08;

            /*
               Manuscrita más elegante y orgánica.
            */
            font-family: "Caveat", cursive;
            font-weight: 600;

            /*
               Más grande que antes, pero adaptable
               a celular y PC.
            */
            font-size: clamp(42px, 7vw, 100px);

            line-height: 1.08;

            text-align: center;

            /*
               Hace que la tinta se mezcle visualmente
               con la superficie de la pared.
            */
            mix-blend-mode: multiply;

            opacity: 0;

            /*
               Ligera irregularidad visual para evitar
               el aspecto de texto digital perfectamente limpio.
            */
            text-shadow:
                0.7px 0.7px 0 rgba(0,0,0,0.25),
                -0.4px 0 rgba(0,0,0,0.12);

            z-index: 8;
            pointer-events: none;
        }

        /*
           Aparece exactamente cuando termina el video.
        */
        #mensajeFinal.revelado {
            animation: escritura 1.6s ease-out forwards;
        }

        @keyframes escritura {

            0% {
                opacity: 0;
                clip-path: inset(0 100% 0 0);
            }

            100% {
                opacity: 0.92;
                clip-path: inset(0 0 0 0);
            }
        }

        /*
           Ajustes específicos para pantallas pequeñas.
        */
        @media (max-width: 600px) {

            #mensajeFinal {
                width: 88%;
                top: 50%;
                font-size: clamp(45px, 9vw, 66px);
                line-height: 1.05;
            }

            #mensajeInicial {
                font-size: 18px;
                letter-spacing: 2px;
            }
        }

        /*
           En pantallas grandes evitamos que el texto
           se vuelva excesivamente grande.
        */
        @media (min-width: 1200px) {

            #mensajeFinal {
                width: 78%;
                font-size: clamp(48px, 4.5vw, 66px);
            }
        }
    </style>
</head>

<body>

    <video id="video" autoplay muted playsinline>
        <source src="VIDEO.mp4" type="video/mp4">
    </video>

    <div id="mensajeInicial">
        TOCA PARA DESPERTARLA
    </div>

    <div id="mensajeFinal">
      MIL CAMBIOS
        DE CODIGO
        PARA UN PUTO
        VIDEO
    </div>

    <script>

        const video = document.getElementById("video");
        const mensajeInicial = document.getElementById("mensajeInicial");
        const mensajeFinal = document.getElementById("mensajeFinal");

        let despertada = false;

        function despertar() {

            if (despertada) return;

            despertada = true;

            video.muted = false;
            video.play();

            mensajeInicial.classList.add("oculto");
        }

        /* El primer toque despierta la obra */
        mensajeInicial.addEventListener("click", despertar);

        video.addEventListener("click", despertar);

        /*
           Al terminar el video, el mensaje aparece
           inmediatamente sobre el último fotograma.
        */
        video.addEventListener("ended", function() {

            mensajeFinal.classList.add("revelado");

        });

    </script>

</body>
</html>
```

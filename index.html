<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro interactivo</title>

    <!-- Fuente manuscrita irregular -->
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           VIDEO
           ===================================================== */

        video {
            display: block;

            width: 100%;
            height: 100%;

            max-width: 100vw;
            max-height: 100vh;

            object-fit: contain;

            margin: 0;
            padding: 0;
        }


        /* =====================================================
           MENSAJE INICIAL
           ===================================================== */

        #mensajeInicial {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-family: Georgia, serif;
            font-size: 22px;
            letter-spacing: 3px;

            text-align: center;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.8);

            cursor: pointer;

            z-index: 10;

            transition: opacity 0.5s ease;
        }

        #mensajeInicial.oculto {
            opacity: 0;
            pointer-events: none;
        }


        /* =====================================================
           MENSAJE FINAL
           ===================================================== */

       /* =====================================================
   PALABRAS DEL MENSAJE FINAL
   ===================================================== */

/* =====================================================
   MENSAJE FINAL — APARICIÓN SUTIL DEL BLOQUE COMPLETO
   ===================================================== */

#mensajeFinal {

    position: absolute;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%)
        rotate(-1deg);

    width: 88%;
    max-width: 1200px;

    text-align: center;

    font-family: "Rock Salt", cursive;
    font-size: clamp(42px, 7vw, 105px);

    /*
       Más espacio vertical entre líneas.
    */
    line-height: 1.35;

    color: #090705;

    /*
       Integración con la pared.
    */
    mix-blend-mode: multiply;

    /*
       Estado inicial:
       casi invisible y ligeramente difuminado.
    */
    opacity: 0;

    filter: blur(4px);

    /*
       Comienza apenas desplazado hacia arriba.
    */
    transform:
        translate(-50%, calc(-50% - 12px))
        rotate(-1deg);

    z-index: 8;

    pointer-events: none;
}


/* =====================================================
   MENSAJE REVELADO
   ===================================================== */

#mensajeFinal.revelado {

    animation:
        aparecerPared 2.8s ease-out forwards;
}


/* =====================================================
   APARICIÓN
   ===================================================== */

@keyframes aparecerPared {

    0% {

        opacity: 0;

        filter: blur(4px);

        transform:
            translate(-50%, calc(-50% - 12px))
            rotate(-1deg);
    }

    35% {

        opacity: 0.25;

        filter: blur(2.5px);

        transform:
            translate(-50%, calc(-50% - 5px))
            rotate(-1deg);
    }

    70% {

        opacity: 0.65;

        filter: blur(0.8px);

        transform:
            translate(-50%, -50%)
            rotate(-1deg);
    }

    100% {

        opacity: 0.92;

        filter: blur(0);

        transform:
            translate(-50%, -50%)
            rotate(-1deg);
    }
}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 600px) {

    #mensajeFinal {

        width: 90%;

        top: 43%;

        font-size: clamp(36px, 10vw, 60px);

        line-height: 1.35;
    }
}


/* =====================================================
   PANTALLAS GRANDES
   ===================================================== */

@media (min-width: 1200px) {

    #mensajeFinal {

        width: 84%;

        top: 44%;

        font-size: clamp(55px, 5.8vw, 105px);
    }
}


/* Palabra visible */

#mensajeFinal .palabra.visible {

    opacity: 0.94;

    transform:
        translateY(0)
        scale(1)
        rotate(0deg);

    filter: blur(0);
}


/* =====================================================
   VARIACIONES MANUALES SUTILES
   ===================================================== */

#mensajeFinal .palabra:nth-child(2) {
    transform:
        translateY(-38px)
        rotate(1.5deg)
        scale(0.94);
}

#mensajeFinal .palabra:nth-child(4) {
    transform:
        translateY(-42px)
        rotate(-1deg)
        scale(0.96);
}

#mensajeFinal .palabra:nth-child(6) {
    transform:
        translateY(-35px)
        rotate(1deg)
        scale(0.93);
}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 600px) {

    #mensajeFinal {

        width: 90%;

        top: 43%;

        font-size: clamp(36px, 10vw, 60px);

        line-height: 1.25;
    }
}


/* =====================================================
   PANTALLAS GRANDES
   ===================================================== */

@media (min-width: 1200px) {

    #mensajeFinal {

        width: 84%;

        top: 44%;

        font-size: clamp(55px, 5.8vw, 105px);
    }
}
    </style>
</head>


<body>


    <!-- =====================================================
         VIDEO
         ===================================================== -->

    <video id="video" autoplay muted playsinline>

        <source src="VIDEO.mp4" type="video/mp4">

    </video>


    <!-- =====================================================
         MENSAJE INICIAL
         ===================================================== -->

    <div id="mensajeInicial">
        TOCA PARA DESPERTARLA
    </div>


    <!-- =====================================================
         MENSAJE FINAL
         ===================================================== -->

    <div id="mensajeFinal">
    NO FUE CASUALIDAD QUE LLEGARAS HASTA AQUÍ.
</div>


    <script>

        const video =
            document.getElementById("video");

        const mensajeInicial =
            document.getElementById("mensajeInicial");

        const mensajeFinal =
            document.getElementById("mensajeFinal");

        const palabras =
            document.querySelectorAll(
                "#mensajeFinal .palabra"
            );


        let despertada = false;


        /* =====================================================
           DESPERTAR
           ===================================================== */

        function despertar() {

            if (despertada) return;

            despertada = true;

            video.muted = false;

            video.play();

            mensajeInicial.classList.add("oculto");
        }


        mensajeInicial.addEventListener(
            "click",
            despertar
        );

        video.addEventListener(
            "click",
            despertar
        );


        /* =====================================================
           FINAL DEL VIDEO
           ===================================================== */

     let mensajeIniciado = false;

/* =====================================================
   COMENZAR EL MENSAJE
   1 SEGUNDO ANTES DEL FINAL
   ===================================================== */

video.addEventListener("timeupdate", function() {

    if (mensajeIniciado) return;

    if (
        video.duration &&
        video.duration - video.currentTime <= 2
    ) {

        mensajeIniciado = true;

        mensajeFinal.classList.add("revelado");
    }

});

    </script>

</body>
</html>

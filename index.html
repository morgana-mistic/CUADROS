<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro interactivo</title>

    <!-- Fuente manuscrita irregular -->
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           VIDEO
           ===================================================== */

        video {
            display: block;

            width: 100%;
            height: 100%;

            max-width: 100vw;
            max-height: 100vh;

            object-fit: contain;

            margin: 0;
            padding: 0;
        }


        /* =====================================================
           MENSAJE INICIAL
           ===================================================== */

        #mensajeInicial {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-family: Georgia, serif;
            font-size: 22px;
            letter-spacing: 3px;

            text-align: center;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.8);

            cursor: pointer;

            z-index: 10;

            transition: opacity 0.5s ease;
        }

        #mensajeInicial.oculto {
            opacity: 0;
            pointer-events: none;
        }


        /* =====================================================
           MENSAJE FINAL
           ===================================================== */

        #mensajeFinal {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 90%;

            max-width: 1000px;

            /*
               Mucho más grande.
               La idea es que domine la pared.
            */
            font-size: clamp(42px, 7vw, 105px);

            line-height: 1.05;

            text-align: center;

            font-family: "Rock Salt", cursive;

            font-weight: normal;

            color: #090705;

            /*
               Integración con la pared.
            */
            mix-blend-mode: multiply;

            opacity: 1;

            z-index: 8;

            pointer-events: none;

            /*
               Un pequeño desplazamiento y rotación
               hacen que no parezca texto perfectamente
               colocado por computadora.
            */
            transform:
                translate(-50%, -50%)
                rotate(-1deg);
        }


        /* =====================================================
           CADA PALABRA
           ===================================================== */
#mensajeFinal .palabra {

    display: inline-block;

    opacity: 0;

    /*
       Comienza ligeramente desplazada hacia arriba
       y aumenta un poco de tamaño.
    */
    transform:
        translateY(-35px)
        scale(0.92)
        rotate(-2deg);

    filter: blur(3px);

    transition:
        opacity 0.45s ease-out,
        transform 0.55s cubic-bezier(.2,.8,.2,1),
        filter 0.55s ease-out;

    /*
       Mayor separación horizontal entre palabras.
       Da una sensación más abierta y natural,
       evitando que la frase quede amontonada.
    */
    margin: 0 0.35em;
}


/*
   Estado visible de cada palabra.
*/

#mensajeFinal .palabra.visible {

    opacity: 0.94;

    transform:
        translateY(0)
        scale(1)
        rotate(0deg);

    filter: blur(0);
}


        /* =====================================================
           VARIACIONES SUTILES
           ===================================================== */

        /*
           Las palabras no quedan todas matemáticamente
           alineadas como una tipografía digital.
        */

        #mensajeFinal .palabra:nth-child(2) {
            transform: translateY(-28px) rotate(1.5deg) scale(0.94);
        }

        #mensajeFinal .palabra:nth-child(4) {
            transform: translateY(-32px) rotate(-1deg) scale(0.96);
        }

        #mensajeFinal .palabra:nth-child(6) {
            transform: translateY(-25px) rotate(1deg) scale(0.93);
        }


        /* =====================================================
           PANTALLAS PEQUEÑAS
           ===================================================== */

        @media (max-width: 600px) {

            #mensajeFinal {

                width: 92%;

                top: 58%;

                font-size: clamp(36px, 10vw, 60px);

                line-height: 1.02;
            }

            #mensajeInicial {
                font-size: 18px;
                letter-spacing: 2px;
            }
        }


        /* =====================================================
           PANTALLAS GRANDES
           ===================================================== */

        @media (min-width: 1200px) {

            #mensajeFinal {

                width: 82%;

                font-size: clamp(55px, 5.8vw, 105px);
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         VIDEO
         ===================================================== -->

    <video id="video" autoplay muted playsinline>

        <source src="VIDEO.mp4" type="video/mp4">

    </video>


    <!-- =====================================================
         MENSAJE INICIAL
         ===================================================== -->

    <div id="mensajeInicial">
        TOCA PARA DESPERTARLA
    </div>


    <!-- =====================================================
         MENSAJE FINAL
         ===================================================== -->

    <div id="mensajeFinal">

        <span class="palabra">NO</span>
        <span class="palabra">FUE</span>
        <span class="palabra">CASUALIDAD</span>
        <span class="palabra">QUE</span>
        <span class="palabra">LLEGARAS</span>
        <span class="palabra">HASTA</span>
        <span class="palabra">AQUÍ.</span>

    </div>


    <script>

        const video =
            document.getElementById("video");

        const mensajeInicial =
            document.getElementById("mensajeInicial");

        const mensajeFinal =
            document.getElementById("mensajeFinal");

        const palabras =
            document.querySelectorAll(
                "#mensajeFinal .palabra"
            );


        let despertada = false;


        /* =====================================================
           DESPERTAR
           ===================================================== */

        function despertar() {

            if (despertada) return;

            despertada = true;

            video.muted = false;

            video.play();

            mensajeInicial.classList.add("oculto");
        }


        mensajeInicial.addEventListener(
            "click",
            despertar
        );

        video.addEventListener(
            "click",
            despertar
        );


        /* =====================================================
           FINAL DEL VIDEO
           ===================================================== */

      video.addEventListener(
    "ended",
    function() {

        palabras.forEach(
            (palabra, indice) => {

                setTimeout(
                    () => {

                        palabra.classList.add(
                            "visible"
                        );

                    },

                    indice * 420
                );

            }
        );

    }
);

    </script>

</body>
</html>

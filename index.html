<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro interactivo</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Zona final del mensaje */
        #final {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
        }

        #mensaje {
            position: relative;
            z-index: 3;
            max-width: 75%;
            text-align: center;
            color: #f5f1e8;
            font-family: Georgia, serif;
            font-size: clamp(22px, 4vw, 42px);
            line-height: 1.3;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        /*
           Mancha de pintura.
           Se coloca delante del mensaje y luego
           se desplaza hacia abajo.
        */
        #pintura {
            position: absolute;
            z-index: 4;
            top: 38%;
            left: 50%;
            width: 58%;
            height: 30%;
            transform: translate(-50%, -50%) scaleY(0);
            transform-origin: top center;
            background: #050505;
            border-radius: 48% 52% 38% 62%;
            opacity: 0;
        }

        #pintura::before,
        #pintura::after {
            content: "";
            position: absolute;
            background: #050505;
            border-radius: 50%;
        }

        #pintura::before {
            width: 25%;
            height: 70%;
            left: -8%;
            top: 35%;
        }

        #pintura::after {
            width: 18%;
            height: 110%;
            right: -6%;
            top: 20%;
        }

        /* Cuando comienza el efecto */
        #final.activo {
            opacity: 1;
        }

        #final.activo #pintura {
            animation:
                aparecer 0.7s ease-out forwards,
                escurrir 2.8s ease-in 0.7s forwards;
        }

        #final.activo #mensaje {
            animation: revelar 2.8s ease-in 1s forwards;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scaleY(0);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scaleY(1);
            }
        }

        @keyframes escurrir {
            from {
                transform: translate(-50%, -50%) scaleY(1);
            }

            to {
                transform: translate(-50%, 80%) scaleY(2.5);
            }
        }

        @keyframes revelar {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <video id="video" autoplay muted playsinline>
        <source src="VIDEO.mp4" type="video/mp4">
    </video>

    <div id="mensajeInicial">TOCA PARA DESPERTARLA</div>

    <div id="final">
        <div id="pintura"></div>

        <div id="mensaje">
            NO FUE CASUALIDAD QUE LLEGARAS HASTA AQUÍ.
        </div>
    </div>

    <script>
        const video = document.getElementById("video");
        const mensajeInicial = document.getElementById("mensajeInicial");
        const final = document.getElementById("final");

        function despertar() {
            video.muted = false;
            video.play();
            mensajeInicial.classList.add("oculto");
        }

        mensajeInicial.addEventListener("click", despertar);
        video.addEventListener("click", despertar);

        video.addEventListener("ended", function() {
            setTimeout(function() {
                final.classList.add("activo");
            }, 700);
        });
    </script>

</body>
</html>

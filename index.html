           ===================================================== */

        #mensajeInicial {

            top: 50%;

       /* =====================================================

   ===================================================== */

/* =====================================================
   MENSAJE FINAL — APARICIÓN SUTIL DEL BLOQUE COMPLETO
   ===================================================== */

#mensajeFinal {

    position: absolute;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%)
        rotate(-1deg);

    width: 88%;
    max-width: 1200px;

    text-align: center;

    font-family: "Rock Salt", cursive;
    font-size: clamp(42px, 7vw, 105px);

    /*
       Más espacio vertical entre líneas.
    */
    line-height: 1.35;

    color: #090705;

    /*
       Integración con la pared.
    */
    mix-blend-mode: multiply;

    /*
       Estado inicial:
       casi invisible y ligeramente difuminado.
    */
    opacity: 0;

    filter: blur(4px);

    /*
       Comienza apenas desplazado hacia arriba.
    */
    transform:
        translate(-50%, calc(-50% - 12px))
        rotate(-1deg);

    z-index: 8;

    pointer-events: none;
}


/* =====================================================
   MENSAJE REVELADO
   ===================================================== */

#mensajeFinal.revelado {

    animation:
        aparecerPared 2.8s ease-out forwards;
}


/* =====================================================
   APARICIÓN
   ===================================================== */

@keyframes aparecerPared {

    0% {

        opacity: 0;

        filter: blur(4px);

        transform:
            translate(-50%, calc(-50% - 12px))
            rotate(-1deg);
    }

    35% {

        opacity: 0.25;

        filter: blur(2.5px);

        transform:
            translate(-50%, calc(-50% - 5px))
            rotate(-1deg);
    }

    70% {

        opacity: 0.65;

        filter: blur(0.8px);

        transform:
            translate(-50%, -50%)
            rotate(-1deg);
    }

    100% {

        opacity: 0.92;

        filter: blur(0);

        transform:
            translate(-50%, -50%)
            rotate(-1deg);
    }
}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 600px) {

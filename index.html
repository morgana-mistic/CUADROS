<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro interactivo</title>

    <!-- Fuente manuscrita irregular -->
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           VIDEO
           ===================================================== */

        video {
            display: block;

            width: 100%;
            height: 100%;

            max-width: 100vw;
            max-height: 100vh;

            object-fit: contain;

            margin: 0;
            padding: 0;
        }


        /* =====================================================
           MENSAJE INICIAL
           ===================================================== */

        #mensajeInicial {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-family: Georgia, serif;
            font-size: 22px;
            letter-spacing: 3px;

            text-align: center;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.8);

            cursor: pointer;

            z-index: 10;

            transition: opacity 0.5s ease;
        }

        #mensajeInicial.oculto {
            opacity: 0;
            pointer-events: none;
        }


        /* =====================================================
           MENSAJE FINAL
           ===================================================== */

       /* =====================================================
   PALABRAS DEL MENSAJE FINAL
   ===================================================== */

#mensajeFinal {
    position: absolute;

    left: 50%;
    top: 45%;

    transform: translateX(-50%) rotate(-1deg);

    /*
       El texto tiene espacio suficiente para distribuirse
       horizontalmente y puede crecer libremente hacia abajo.
    */
    width: 88%;
    max-width: 1200px;

    text-align: center;

    /*
       Importante:
       el bloque NO tiene una altura fija.
       Puede crecer hacia abajo según la cantidad de líneas.
    */
    height: auto;

    font-family: "Rock Salt", cursive;
    font-size: clamp(42px, 7vw, 105px);
    line-height: 1.25;

    color: #090705;

    mix-blend-mode: multiply;

    opacity: 1;

    z-index: 8;

    pointer-events: none;
}


/* Cada palabra */

#mensajeFinal .palabra {

    display: inline-block;

    opacity: 0;

    /*
       Cada palabra entra desde arriba.
    */
    transform:
        translateY(-45px)
        scale(0.90)
        rotate(-2deg);

    filter: blur(3px);

    /*
       Separación REAL entre palabras.
       Ya no necesitamos exagerar el margin.
    */
    margin-left: 0.18em;
    margin-right: 0.18em;

    transition:
        opacity 0.45s ease-out,
        transform 0.55s cubic-bezier(.2,.8,.2,1),
        filter 0.55s ease-out;
}


/* Palabra visible */

#mensajeFinal .palabra.visible {

    opacity: 0.94;

    transform:
        translateY(0)
        scale(1)
        rotate(0deg);

    filter: blur(0);
}


/* =====================================================
   VARIACIONES MANUALES SUTILES
   ===================================================== */

#mensajeFinal .palabra:nth-child(2) {
    transform:
        translateY(-38px)
        rotate(1.5deg)
        scale(0.94);
}

#mensajeFinal .palabra:nth-child(4) {
    transform:
        translateY(-42px)
        rotate(-1deg)
        scale(0.96);
}

#mensajeFinal .palabra:nth-child(6) {
    transform:
        translateY(-35px)
        rotate(1deg)
        scale(0.93);
}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 600px) {

    #mensajeFinal {

        width: 90%;

        top: 43%;

        font-size: clamp(36px, 10vw, 60px);

        line-height: 1.25;
    }
}


/* =====================================================
   PANTALLAS GRANDES
   ===================================================== */

@media (min-width: 1200px) {

    #mensajeFinal {

        width: 84%;

        top: 44%;

        font-size: clamp(55px, 5.8vw, 105px);
    }
}
    </style>
</head>


<body>


    <!-- =====================================================
         VIDEO
         ===================================================== -->

    <video id="video" autoplay muted playsinline>

        <source src="VIDEO.mp4" type="video/mp4">

    </video>


    <!-- =====================================================
         MENSAJE INICIAL
         ===================================================== -->

    <div id="mensajeInicial">
        TOCA PARA DESPERTARLA
    </div>


    <!-- =====================================================
         MENSAJE FINAL
         ===================================================== -->

    <div id="mensajeFinal">

        <span class="palabra">LO QUE</span>
        <span class="palabra">BUSCAS</span>
        <span class="palabra">TAMBIEN</span>
        <span class="palabra">TE </span>
        <span class="palabra">ESTÁ</span>
        <span class="palabra">BUSCANDO</span>
        <span class="palabra">A TI.</span>

    </div>


    <script>

        const video =
            document.getElementById("video");

        const mensajeInicial =
            document.getElementById("mensajeInicial");

        const mensajeFinal =
            document.getElementById("mensajeFinal");

        const palabras =
            document.querySelectorAll(
                "#mensajeFinal .palabra"
            );


        let despertada = false;


        /* =====================================================
           DESPERTAR
           ===================================================== */

        function despertar() {

            if (despertada) return;

            despertada = true;

            video.muted = false;

            video.play();

            mensajeInicial.classList.add("oculto");
        }


        mensajeInicial.addEventListener(
            "click",
            despertar
        );

        video.addEventListener(
            "click",
            despertar
        );


        /* =====================================================
           FINAL DEL VIDEO
           ===================================================== */

     let mensajeIniciado = false;

video.addEventListener("timeupdate", function() {

    if (
        !mensajeIniciado &&
        video.duration - video.currentTime <= 2
    ) {

        mensajeIniciado = true;

        palabras.forEach(
            (palabra, indice) => {

                setTimeout(
                    () => {

                        palabra.classList.add("visible");

                    },

                    indice * 420
                );

            }
        );
    }

});

    </script>

</body>
</html>
